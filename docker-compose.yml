# Jaipurio production stack — deploy in Coolify with the "Docker Compose" build pack.
#
# Only jaipurio-web gets a domain in Coolify. It serves the React app and
# forwards /api, /uploads and /robots.txt to jaipurio-api over the private
# network. The API and Redis are never exposed to the internet.
#
# No secrets live in this file: Coolify lists every ${VAR} below in its
# Environment Variables tab. `:?` = required, `:-x` = optional (default x).
# Setup steps: DEPLOY_COOLIFY.md

services:
  jaipurio-web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - jaipurio-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  jaipurio-api:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "5000"
    depends_on:
      jaipurio-redis:
        condition: service_healthy
    environment:
      # Fixed for this stack
      NODE_ENV: production
      PORT: "5000"
      TRUST_PROXY: "true"
      REDIS_ENABLED: "true"
      REDIS_URL: redis://jaipurio-redis:6379

      # Required
      MONGODB_URI: ${MONGODB_URI:?}
      # Also encrypts payment-gateway keys saved from the admin panel —
      # keep the SAME value the current deployment uses.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}

      # App
      FRONTEND_URL: ${FRONTEND_URL:-}
      USE_DEFAULT_OTP: ${USE_DEFAULT_OTP:-false}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-}
      WITHDRAWAL_FEE_RATE: ${WITHDRAWAL_FEE_RATE:-}

      # Rate limits (empty = code defaults in backend/middlewares/rateLimiter.js)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_APP_MAX: ${RATE_LIMIT_APP_MAX:-}
      RATE_LIMIT_APP_WINDOW_MS: ${RATE_LIMIT_APP_WINDOW_MS:-}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-}
      RATE_LIMIT_OTP_MAX: ${RATE_LIMIT_OTP_MAX:-}
      RATE_LIMIT_OTP_WINDOW_MS: ${RATE_LIMIT_OTP_WINDOW_MS:-}
      RATE_LIMIT_PUBLIC_MAX: ${RATE_LIMIT_PUBLIC_MAX:-}
      RATE_LIMIT_PUBLIC_WINDOW_MS: ${RATE_LIMIT_PUBLIC_WINDOW_MS:-}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-}
      RATE_LIMIT_UPLOAD_WINDOW_MS: ${RATE_LIMIT_UPLOAD_WINDOW_MS:-}
      RATE_LIMIT_COUPON_MAX: ${RATE_LIMIT_COUPON_MAX:-}
      RATE_LIMIT_COUPON_WINDOW_MS: ${RATE_LIMIT_COUPON_WINDOW_MS:-}
      RATE_LIMIT_CONSULT_MAX: ${RATE_LIMIT_CONSULT_MAX:-}
      RATE_LIMIT_CONSULT_WINDOW_MS: ${RATE_LIMIT_CONSULT_WINDOW_MS:-}
      OTP_RATE_LIMIT: ${OTP_RATE_LIMIT:-}
      OTP_RATE_WINDOW: ${OTP_RATE_WINDOW:-}

      # Media (Cloudinary)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # SMS OTP (SMS India Hub)
      SMS_INDIA_HUB_API_KEY: ${SMS_INDIA_HUB_API_KEY:-}
      SMS_INDIA_HUB_SENDER_ID: ${SMS_INDIA_HUB_SENDER_ID:-}
      SMS_INDIA_HUB_TEMPLATE_ID: ${SMS_INDIA_HUB_TEMPLATE_ID:-}
      SMS_INDIA_HUB_ENTITY_ID: ${SMS_INDIA_HUB_ENTITY_ID:-}
      SMS_INDIA_HUB_URL: ${SMS_INDIA_HUB_URL:-}
      SMS_BRAND_NAME: ${SMS_BRAND_NAME:-}

      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Payments
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}

      # Shipping
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SHIPROCKET_BASE_URL: ${SHIPROCKET_BASE_URL:-}
      DTDC_API_KEY: ${DTDC_API_KEY:-}
      DTDC_ACCESS_TOKEN: ${DTDC_ACCESS_TOKEN:-}
      DTDC_CUSTOMER_CODE: ${DTDC_CUSTOMER_CODE:-}
      DTDC_BASE_URL: ${DTDC_BASE_URL:-}
      DTDC_TRACK_URL: ${DTDC_TRACK_URL:-}
      DTDC_LABEL_CODE: ${DTDC_LABEL_CODE:-}

      # Push notifications (Firebase Admin)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY_ID: ${FIREBASE_PRIVATE_KEY_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_CLIENT_ID: ${FIREBASE_CLIENT_ID:-}
      FIREBASE_CLIENT_CERT_URL: ${FIREBASE_CLIENT_CERT_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot runs startup migrations (countries/states/cities) before listening
      start_period: 120s

  jaipurio-redis:
    image: redis:7-alpine
    # Cache only: no persistence, evict least-recently-used keys at 256 MB
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
