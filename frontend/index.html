    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Only the real domain may be indexed; demo/preview copies (Vercel, Render,
      // staging) get noindex so they never compete with jaipurio.in in Google.
      (function () {
        var h = location.hostname.replace(/^www\./, '');
        if (h !== 'jaipurio.in') {
          var m = document.createElement('meta');
          m.name = 'robots';
          m.content = 'noindex, nofollow';
          m.setAttribute('data-host-noindex', 'true');
          document.head.appendChild(m);
        }
      })();
    </script>
