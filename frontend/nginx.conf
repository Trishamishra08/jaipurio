# Serves the React build and forwards API traffic to the backend container.
# Coolify's Traefik terminates HTTPS in front of this container.

# Pass on the visitor IP that Traefik put in X-Forwarded-For instead of
# appending Traefik's own address: the backend trusts exactly one proxy hop
# (TRUST_PROXY=true) and rate-limits per visitor IP.
map $http_x_forwarded_for $client_forwarded_for {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $client_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads allow up to 25 MB (backend/routes/mediaRoutes.js)
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve the backend through Docker's DNS at request time, so nginx starts
    # even if the API is still booting and follows it when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://jaipurio-api:5000;
    set $imgproxy_upstream http://jaipurio-imgproxy:8080;

    # Public images from the anonymous-read jaipurio bucket. The source URL
    # is fixed here rather than supplied by visitors; imgproxy also restricts
    # sources to this bucket. Ignore client query strings on object requests.
    location /images/ {
        rewrite ^/images/(.+)$ /unsafe/rs:fit:1600:1600/plain/http://jaipurio-minio:9000/jaipurio/$1? break;
        proxy_pass $imgproxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host jaipurio-imgproxy;
    }

    # API, legacy uploads and the admin-editable robots.txt live on the backend
    location ~ ^/(api/|uploads/|robots\.txt$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Hashed build output never changes under the same name
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the app shell and the push-notification service worker
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA: unknown paths fall back to the React router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
