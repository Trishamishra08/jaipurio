# Serves the React build and forwards API traffic to the backend container.
# Coolify's Traefik terminates HTTPS in front of this container.

# Pass on the visitor IP that Traefik put in X-Forwarded-For instead of
# appending Traefik's own address: the backend trusts exactly one proxy hop
# (TRUST_PROXY=true) and rate-limits per visitor IP.
map $http_x_forwarded_for $client_forwarded_for {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $client_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Search crawlers asking for "/" get a real 301 to /home (the storefront home).
# Browsers are left alone: inside the Jaipurio app "/" is the splash screen,
# which the React router decides on, and a server redirect would skip it.
map $http_user_agent $crawler_root_redirect {
    default 0;
    "~*(googlebot|bingbot|applebot|duckduckbot|yandexbot|baiduspider|slurp)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # One canonical host: www.jaipurio.in answered with a full copy of the site
    # (200), so Google saw every page twice. 301 it to the bare domain.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Old product URLs of the previous site (/products/<old-slug>) -> the same product
    # at its current URL. The map lives in legacy-redirects.conf (generated by
    # backend/scripts/buildLegacyRedirects.js, loaded from conf.d before this file).
    if ($legacy_redirect_target) {
        return 301 https://$host$legacy_redirect_target;
    }

    # The previous shop had ~3,600 /product-tags/<tag> pages. This site has no tag pages,
    # so tell crawlers they are gone for good (410) instead of serving the app shell (200).
    location ^~ /product-tags/ {
        return 410;
    }

    # URLs that never existed on this shop (language prefixes, WordPress-style
    # tag/author/feed/wp-* paths, *.php) but are still known to Google from an old or
    # hacked version of the site. The SPA fallback answered them with 200 + the app's
    # "Page not found" screen (a soft 404). 410 tells Google to drop them.
    location ~* ^/(fr|de|es|pt|it|ru|nl|pl|tr|ja|zh|ar)(/|$) {
        return 410;
    }
    location ~* ^/(tag|tags|author|feed|wp-[a-z0-9-]+|xmlrpc\.php)(/|$) {
        return 410;
    }
    location ~* \.php$ {
        return 410;
    }

    # Blog articles: ask the API whether the article exists so a missing one gets a
    # real 404 status (the React app still renders its "Article not found" page).
    # Before this, every /blog/<anything> answered 200 and Google logged soft 404s for
    # old article URLs. If the API is down we fall back to 200 rather than 404 real
    # articles. Slugs are limited to [A-Za-z0-9_-]; anything else goes to the SPA.
    location ~ ^/blog/([A-Za-z0-9_-]+)/?$ {
        set $blog_slug $1;
        auth_request /_blog_exists;
        # A removed article whose slug clearly names a live one: the backend adds
        # X-Blog-Redirect and we answer 301. Normal articles have no such header.
        auth_request_set $blog_redirect $upstream_http_x_blog_redirect;
        if ($blog_redirect) {
            return 301 https://$host$blog_redirect;
        }
        error_page 403 =404 /index.html;
        error_page 500 502 503 504 =200 /index.html;
        add_header Cache-Control "no-cache";
        try_files /__no_such_file__ @shell;
    }
    # Backend answers 204 (exists) or 403 (missing); auth_request understands both.
    location = /_blog_exists {
        internal;
        proxy_pass $api_upstream/api/blogs/exists/$blog_slug;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # Media uploads allow up to 25 MB (backend/routes/mediaRoutes.js)
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve the backend through Docker's DNS at request time, so nginx starts
    # even if the API is still booting and follows it when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://jaipurio-api:5000;
    set $imgproxy_upstream http://jaipurio-imgproxy:8080;

    # Public images from the anonymous-read jaipurio bucket. The source URL
    # is fixed here rather than supplied by visitors; imgproxy also restricts
    # sources to this bucket. Ignore client query strings on object requests.
    location /images/ {
        rewrite ^/images/(.+)$ /unsafe/rs:fit:1600:1600/plain/http://jaipurio-minio:9000/jaipurio/$1? break;
        proxy_pass $imgproxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host jaipurio-imgproxy;
    }

    # Legacy image URLs from the old site (/storage/<path>), still stored in
    # migrated blog posts and indexed by Google. The same files live in the
    # jaipurio bucket under the same path. Without this the SPA fallback answers
    # with index.html and every blog image shows as broken.
    # Sent to the public MinIO address that the API already uses for product images
    # (https://minio-jaipurio.sakha.cloud/jaipurio/...). Going through imgproxy
    # instead failed with "Source is unreachable". $request_uri keeps the original
    # percent-encoding, so names like "14 (2)-2 (1).png" survive.
    location /storage/ {
        if ($request_uri ~ "^/storage/([^?]+)") {
            return 301 https://minio-jaipurio.sakha.cloud/jaipurio/$1;
        }
        return 404;
    }

    # Account pages: keep them out of Google. The header works without JS.
    # robots.txt must NOT block these paths, or Google never sees the header.
    location ~ ^/(login|register|signup)/?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # API, legacy uploads, the admin-editable robots.txt, the XML sitemaps and
    # llms.txt live on the backend (otherwise the SPA fallback below would
    # answer them with the homepage).
    location ~ ^/(api/|uploads/|robots\.txt$|llms\.txt$|sitemap(-[a-z]+)?\.xml$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Any other .xml address is not a file of this site (old sitemap1.xml,
    # blog-posts-2024-08.xml, blog-tags.xml ... were submitted to Search Console in
    # 2024). The SPA fallback answered them with the HTML app shell and a 200, which
    # Search Console reports as "Sitemap is HTML". Answer 404 instead. The real sitemaps
    # matched the backend location above first, so they are unaffected.
    location ~* \.xml$ {
        return 404;
    }

    # Hashed build output never changes under the same name
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the app shell and the push-notification service worker
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
    }

    location = / {
        if ($crawler_root_redirect) {
            return 301 https://$host/home;
        }
        try_files /index.html =404;
    }

    # SPA: a real file is served as is; every other path is a storefront page.
    location / {
        try_files $uri @shell;
    }

    # Page HTML from the API: index.html with this page's title, description,
    # canonical, JSON-LD, H1, text and links written in (backend/utils/seoShell.js),
    # so crawlers and slow phones see the page before React loads. React replaces
    # #root on mount. Any API error (or 429) falls back to the plain index.html.
    location @shell {
        proxy_pass $api_upstream/api/seo-shell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Shell-Path $uri;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @spa;
        add_header Cache-Control "no-cache";
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
